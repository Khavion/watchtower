# Channel and pipeline settings.
#
# SCHEDULES NO LONGER LIVE HERE. As of 2026-07-25 they live in the `jobs` table
# in data/watchtower.db, seeded from the JOBS list in pipeline/dispatch.py, so
# adding an agent later is one row rather than a config edit plus a restart.
#
#   see what is scheduled:  .venv/bin/python -m pipeline.dispatch --status
#   re-seed the table:      .venv/bin/python -m pipeline.dispatch --register
#
# Procurement stays twice daily on weekdays by design: solicitation response
# windows run weeks, earlier detection is worth nothing, and hourly polling
# invites rate limits and IP blocks. Scoring, go/no-go, and drafting trigger
# on a completed fetch, not a clock.

timezone: America/Chicago

# Stages chained after each completed fetch, in order.
pipeline_on_fetch: [classify, score, gonogo, draft, publish]

cliq:
  channel_unique_name: khavionagent
