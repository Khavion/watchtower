# LLM provider selection. Switching providers means changing `active` and
# nothing else (locked decision; hosted is intentionally unwired).

active: ollama

ollama:
  base_url: http://127.0.0.1:11434
  # The workhorse. Every agent shares this one resident model; nothing swaps
  # models per agent, because a swap costs 3-10s and risks pushing 16 GB into
  # swap where throughput collapses. Resident cost is ~1.3-1.5x the 6.6 GB tag.
  model: qwen3.5:latest
  # Ollama's server default is 4096 REGARDLESS of the model's advertised
  # context (verified 2026-07-25 on this Mini). Long solicitations were being
  # truncated before the model saw them; that is the likely source of the
  # classifier's false negatives. Set explicitly here AND in the environment
  # (deploy/com.khavion.ollamaenv.plist) so nothing silently falls back.
  num_ctx: 16384
  temperature: 0.4
  # This model has a thinking mode. Off: reasoning traces must never reach a
  # draft, and the provider strips <think> blocks defensively as well.
  think: false
  # Keep the workhorse resident between agent turns; reloading is the slow part.
  keep_alive: 24h
  timeout_seconds: 300

hosted:
  # Stub. providers/hosted.py raises NotImplementedError by design.
  # Not a cost decision to revisit casually: everything here is free and local.
  model: null
