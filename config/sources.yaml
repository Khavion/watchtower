# Procurement source registry.
# Access method and verification date are recorded per source (build requirement).
# All research verified 2026-07-24 via official docs / live-site inspection.
# Re-verify quarterly: portal URLs churn (houstontx.gov purchasing moved in 2025-26).

defaults:
  user_agent: "KhavionWatchtower/1.0 (procurement monitor; contact: zkhawaja721@gmail.com)"
  min_seconds_between_requests: 5
  timeout_seconds: 30
  max_retries: 3
  backoff_factor: 2.0

sam_gov:
  enabled: true
  access_method: official_api
  verified: "2026-07-24"
  base_url: "https://api.sam.gov/opportunities/v2/search"
  notes: >
    Get Opportunities Public API v2. Key in khavion-sam-api-key (Keychain).
    Basic personal key = 10 requests/day until an entity is associated with the
    sam.gov profile (then 1,000/day); quota resets midnight UTC; 429 on breach.
    postedFrom/postedTo are mandatory, MM/dd/yyyy, max 1-year span. limit must
    be passed explicitly (server default is 1). Response postedDate uses a
    different format (YYYY-MM-DD HH:MM:SS). The notice description is a URL
    requiring an extra keyed call, budgeted under sam_max_calls_per_day.
  # r = Sources Sought, s = Special Notice. There is no dedicated RFI ptype;
  # RFIs are conventionally posted under r or s, so we poll both.
  ptypes_primary: [r, s]
  # Full solicitations: fetched, but flagged NOT_YET_ELIGIBLE when they carry
  # past-performance requirements (a firm with no federal past performance
  # cannot answer them yet).
  ptypes_secondary: [o, k, p]
  naics: ["541512", "541511", "541519", "518210"]
  lookback_days: 3
  max_calls_per_run: 4

esbd:
  enabled: true
  access_method: polite_scrape
  verified: "2026-07-24"
  approved_by_owner: "2026-07-24"   # Zohaib approved scraping despite robots.txt Disallow: /
  list_url: "https://www.txsmartbuy.gov/esbd"
  detail_url_prefix: "https://www.txsmartbuy.gov/esbd/"
  notes: >
    Texas Electronic State Business Daily. Server-rendered HTML; no API, no RSS,
    no data.texas.gov mirror (all checked 2026-07-24). robots.txt is a blanket
    Disallow: / — owner approved polite scraping: 2 runs/day weekdays, real UA
    with contact email, >=5s between requests, hard page cap. URL query filters
    silently no-op (?keyword= returns the unfiltered corpus — verified), so we
    page the list and filter locally. Default ordering is last-updated and bulk
    re-timestamping reorders old records: read several pages, select on posting
    date, never diff page 1.
  max_pages_per_run: 10
  # Detail pages are fetched only for rows passing the title prefilter, within
  # this budget, and never for already-stored dedupe keys.
  detail_budget_per_run: 15
  # Broad net deciding which rows earn a detail fetch (title-only match);
  # the strict keep/drop filter below runs on full detail text + NIGP.
  title_prefilter_keywords: [software, technology, cloud, data, system, network,
                             computer, digital, telecom, cyber, security, consult,
                             managed services, hosting, analytics, intelligence,
                             automation, modernization, erp, crm, portal, web,
                             application, information]
  # NIGP class prefixes of interest (data processing / software / consulting
  # families). Local filter only; refined during adapter build.
  nigp_class_prefixes: ["204", "208", "209", "918", "920", "946", "958", "961", "962"]
  keywords: [cloud, aws, azure, kubernetes, artificial intelligence, machine learning,
             llm, generative ai, genai, chatbot, data platform, devops, migration,
             modernization, software development, it consulting]

houston_local:
  # City of Houston + Harris County. Both portals are genuinely unreachable
  # for a no-JS, requests-only client (verified 2026-07-24); the adapter ships
  # implementing the contract but disabled, and fails loudly if force-enabled.
  enabled: false
  access_method: blocked
  verified: "2026-07-24"
  reason: >
    City of Houston moved bids to Beacon Bid (legacy purchasing.houstontx.gov
    301-redirects to houstontx.gov/bizwithhou); Beacon Bid returns HTTP 403 to
    every non-browser request including robots.txt, and no public API exists.
    Harris County distributes via Bonfire (Euna): the portal is a JS-rendered
    shell (raw HTML contains no data) and robots.txt disallows all.
    TODO(zohaib): register as a City of Houston vendor on Beacon Bid and as a
    Harris County supplier in Bonfire (both free) and enable NIGP-matched
    email alerts; those alerts are the compliant path for these two sources.
  portals:
    houston_beacon: "https://www.beaconbid.com/solicitations/city-of-houston/open"
    harris_bonfire: "https://harriscountytx.bonfirehub.com/portal/?tab=openOpportunities"

university_boards:
  enabled: true
  access_method: via_esbd
  verified: "2026-07-24"
  notes: >
    UH, Texas A&M System, and UT institutions cross-post formal solicitations to
    ESBD (state agencies >= $25k; UT System policy says >= $50k, so smaller UT
    work hides on Bonfire portals we cannot reach). AggieBid
    (bids.sciquest.com, Jaggaer) is server-rendered but robots-disallowed and
    redundant with ESBD, so it is not fetched. This adapter filters ESBD records
    by Agency/Texas SmartBuy Member Number. Numbers below extracted from the
    live ESBD agency dropdown on 2026-07-24.
  agency_numbers:
    "730": "University Of Houston"
    "759": "Univ Of Houston At Clear Lake"
    "784": "Univ. Of Houston - Downtown"
    "710": "Texas A&M University System"
    "711": "Texas A&M University"
    "712": "Texas A&M Engineering Experiment Station"
    "709": "Texas A&M University Health Science Center"
    "720": "University Of Texas System"
    "721": "University Of Texas At Austin"
  # Also matched by name keywords in title/description as a safety net:
  name_keywords: ["university of houston", "texas a&m", "university of texas", "ut austin", "uthealth", "md anderson"]
  detail_budget_per_run: 8
